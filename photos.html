<!-- ---- Lightbox markup ---- -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">&#10094;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">&#10095;</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.photo-grid a'));
  if (!links.length) return;

  var photos = links.map(function (a) {
    return { href: a.getAttribute('href'), alt: a.querySelector('img') ? a.querySelector('img').alt : '' };
  });

  var box = document.getElementById('lightbox');
  var img = document.getElementById('lbImg');
  var counter = document.getElementById('lbCounter');
  var current = 0;

  function preload(i) {
    if (i < 0 || i >= photos.length) return;
    var p = new Image();
    p.src = photos[i].href;
  }

  function show(i) {
    current = (i + photos.length) % photos.length;
    img.src = photos[current].href;
    img.alt = photos[current].alt;
    counter.textContent = (current + 1) + ' / ' + photos.length;
    preload(current + 1);
    preload(current - 1);
  }

  function open(i) {
    show(i);
    box.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    box.classList.remove('open');
    document.body.style.overflow = '';
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  // Open on thumbnail click
  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      open(i);
    });
  });

  // Controls
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); next(); });
  document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); prev(); });

  // Click backdrop (not the image) to close
  box.addEventListener('click', function (e) {
    if (e.target === box) close();
  });

  // Keyboard
  document.addEventListener('keydown', function (e) {
    if (!box.classList.contains('open')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Escape') close();
  });

  // Swipe
  var startX = 0, startY = 0, tracking = false;
  box.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  box.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });
})();
</script>
